    // document mints the blobs for its OWN frames, obtaining page text

      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

    // unanswered request leaves the frame on about:blank, the same

        const m = MARKER.exec(el.getAttribute('src') || '');

:auto 0;display:flex;flex-direction:column;flex:none\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:48px\">\n          <img src=\"imagem-f89b9cd067a7.png\" alt=\"Instituto Nacional de Saúde de Moçambique\" style=\"width:108px;max-width:25vw;height:auto;object-fit:contain;background:white;border-radius:4px\">\n          <div style=\"font-size:13px;line-height:1.3;color:#5b6360\">Instituto Nacional de Saúde<br><span style=\"color:#8a918e\">MISAU · Moçambique</span></div>\n        </div>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#007088;margin-bottom:14px\">Identificação do participante</div>\n        <h1 style=\"{{ loginTitleStyle }};color:#007088\">Curso Virtual de Investigação de Surtos</h1>\n        <p style=\"font-size:16px;line-height:1.55;color:#5b6360;margin:0 0 36px;max-width:44ch;text-wrap:pretty\">Indique o seu email para identificar a participação no curso. Não é necessária palavra-passe nesta fase.</p>\n        <div style=\"display:flex;flex-direction:column;gap:16px;max-width:420px\">\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#3d4542\">Email\n            <input type=\"email\" value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"nome@ins.gov.mz\" style=\"font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #cfd3d1;border-radius:8px;background:#e2f4f7;outline:none\" style-focus=\"font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #007088;border-radius:8px;background:#ffffff;outline:none;box-shadow:0 0 0 3px #cdeaee\">\n          </label>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#3d4542\">Código de inscrição (se fornecido)\n            <input type=\"text\" value=\"{{ loginCode }}\" sc-camel-on-change=\"{{ onCode }}\" placeholder=\"Opcional nesta fase\" style=\"font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #cfd3d1;border-radius:8px;background:#e2f4f7;outline:none;letter-spacing:.06em\" style-focus=\"font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #007088;border-radius:8px;background:#ffffff;outline:none;letter-spacing:.06em;box-shadow:0 0 0 3px #cdeaee\">\n          </label>\n          <sc-if value=\"{{ hasLoginError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;line-height:1.5;color:#b3261e;background:#fdecea;border:1px solid #f3c4bf;border-radius:8px;padding:11px 14px\">{{ loginError }}</div>\n          </sc-if>\n          <button sc-camel-on-click=\"{{ onLogin }}\" style=\"font-family:inherit;font-size:15px;font-weight:700;color:#ffffff;background:#007088;border:none;border-radius:8px;padding:14px 18px;cursor:pointer;margin-top:6px\" style-hover=\"font-family:inherit;font-size:15px;font-weight:700;color:#ffffff;background:#00596c;border:none;border-radius:8px;padding:14px 18px;cursor:pointer;margin-top:6px\">Entrar no curso</button>\n<button sc-camel-on-click=\"{{ onReview }}\" style=\"font:inherit;font-weight:700;padding:14px;border:1px solid #007088;border-radius:8px;color:#007088;background:#e2f4f7;cursor:pointer\">Rever conteúdos e imagens</button><p style=\"font-size:13px;color:#5b6360;margin:0\">Consulta livre, sem preencher dados, fazer testes ou alterar o progresso dos formandos.</p>          <sc-if value=\"{{ hasSaved }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:#3d4542;background:#f2f8f9;border:1px solid #cfe3e7;border-radius:8px;padding:11px 14px\">\n              <span style=\"flex:1;min-width:0\">Retoma onde parou: <strong>{{ resumeLabel }}</strong></span>\n              <button sc-camel-on-click=\"{{ onReset }}\" style=\"font-family:inherit;font-size:12.5px;font-weight:600;color:#00596c;background:none;border:1px solid #9fc9d1;border-radius:6px;padding:6px 10px;cursor:pointer;flex:none\">Voltar ao início</button>\n            </div>\n          </sc-if>\n          \n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#8a918e;padding-top:12px;border-top:1px solid #eef2f1\">\n            <span>Equipa do INS:</span>\n            <a href=\"painel.html\" style=\"font-weight:600;color:#007088;text-decoration:none;border-bottom:1px solid #9fc9d1\">Painel de acompanhamento</a>\n            <span>— requer código próprio.</span>\n          </div>\n          \n        </div>\n        </div>\n      </div>\n      <div style=\"{{ loginAsideStyle }}\"><div style=\"margin:auto;display:flex;align-items:center;justify-content:center;padding:30px;background:#e8f5f7;border-radius:18px\"><img src=\"imagem-a2cb63c55260.png\" alt=\"Manuseamento de uma placa de cultura em laboratório\" style=\"width:212px;max-width:100%;height:auto;border-radius:12px\"></div></div>\n    </div>\n  </sc-if>\n\n<sc-if value=\"{{ showSession }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"status\" aria-live=\"polite\" style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 18px;background:#e2f4f7;color:#00404f;font-size:13px\"><span style=\"flex:1\">{{ syncStatus }}</span><sc-if value=\"{{ isLearner }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ onSync }}\" style=\"font:inherit;color:#007088;background:white;border:1px solid #9fc9d1;border-radius:7px;padding:7px\">Sincronizar</button><button sc-camel-on-click=\"{{ onHistory }}\" style=\"font:inherit;color:#007088;background:white;border:1px solid #9fc9d1;border-radius:7px;padding:7px\">Histórico de testes</button></sc-if><sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ onGallery }}\" style=\"font:inherit;color:#007088;border:1px solid #9fc9d1;background:white;border-radius:7px;padding:7px\">Ver todas as imagens</button></sc-if><button sc-camel-on-click=\"{{ onExit }}\" style=\"font:inherit;color:#007088;background:white;border:1px solid #9fc9d1;border-radius:7px;padding:7px\">Sair</button></div></sc-if>\n<sc-if value=\"{{ showHistory }}\" hint-placeholder-val=\"{{ false }}\"><section style=\"max-height:40vh;overflow:auto;padding:18px;background:white;border-bottom:2px solid #007088\"><h2>Histórico de testes</h2><p>As tentativas anteriores são preservadas. A melhor nota conta para a aprovação.</p><sc-if value=\"{{ historyEmpty }}\" hint-placeholder-val=\"{{ false }}\"><p>Ainda não existem tentativas de teste.</p></sc-if><sc-for list=\"{{ historyRows }}\" as=\"h\" hint-placeholder-count=\"0\"><div style=\"display:flex;flex-wrap:wrap;gap:18px;border-top:1px solid #c7e0e5;padding:10px\"><span>{{ h.date }}</span><strong>{{ h.module }}</strong><span>{{ h.score }}</span><span>{{ h.status }}</span></div></sc-for></section></sc-if>\n<sc-if value=\"{{ showGallery }}\" hint-placeholder-val=\"{{ false }}\"><section style=\"overflow-y:auto;padding:24px;flex:1;min-height:0\"><div style=\"max-width:1000px;margin:auto\"><h1 style=\"color:#007088\">Imagens do curso</h1><button sc-camel-on-click=\"{{ onGallery }}\" style=\"font:inherit;padding:12px;border:1px solid #007088;border-radius:8px;background:white;color:#007088\">Voltar aos conteúdos</button><p>As imagens são apresentadas por localização. Seleccione uma figura para a ampliar.</p><sc-for list=\"{{ galleryItems }}\" as=\"g\" hint-placeholder-count=\"0\"><figure style=\"margin:24px 0;padding:20px;border:1px solid #c7e0e5;border-radius:16px;background:white\"><h2 style=\"color:#007088;font-size:20px\">{{ g.title }}</h2><button sc-camel-on-click=\"{{ g.onOpen }}\" aria-label=\"Ampliar imagem\" style=\"padding:0;border:0;background:white;width:100%;cursor:zoom-in\"><img loading=\"lazy\" decoding=\"async\" src=\"{{ g.src }}\" alt=\"{{ g.caption }}\" style=\"display:block;max-width:100%;max-height:700px;width:auto;height:auto;margin:auto\"></button><figcaption style=\"margin-top:12px\">{{ g.caption }}</figcaption></figure></sc-for></div></section></sc-if>  <sc-if value=\"{{ showPerfil }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px;background:#d8e7eb\">\n      <div style=\"width:100%;max-width:560px;background:#ffffff;border:1px solid #e3e5e3;border-radius:14px;padding:34px 30px;margin:auto 0\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n          <img src=\"imagem-f89b9cd067a7.png\" alt=\"Instituto Nacional de Saúde de Moçambique\" style=\"width:108px;max-width:25vw;height:auto;object-fit:contain;background:white;border-radius:4px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#007088\">Primeiro acesso</div>\n        </div>\n        <h1 style=\"font-family:'Source Sans 3',Helvetica,Arial,sans-serif;font-size:27px;line-height:1.2;margin:0 0 10px;color:#007088;color:#007088\">Onde trabalha?</h1>\n        <p style=\"font-size:15px;line-height:1.6;color:#5b6360;margin:0 0 26px;max-width:52ch;text-wrap:pretty\">Indique o nome completo e os dados profissionais. Permitem ao INS saber em que distritos há pessoal formado e planear onde reforçar a formação.</p>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n<label style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#3d4542\">Nome completo<input type=\"text\" autocomplete=\"name\" value=\"{{ loginNome }}\" sc-camel-on-change=\"{{ onNome }}\" style=\"font:inherit;padding:12px;border:1px solid #c7e0e5;border-radius:8px;background:#e2f4f7\"></label>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#3d4542\">Província\n            <sc-raw-select value=\"{{ loginProv }}\" sc-camel-on-change=\"{{ onProv }}\" style=\"font-family:inherit;font-size:15px;padding:12px;border:1px solid #cfd3d1;border-radius:8px;background:#e2f4f7;min-height:48px\">\n              <option value=\"\">Seleccione…</option>\n              <sc-for list=\"{{ provincias }}\" as=\"p\" hint-placeholder-count=\"0\">\n                <option value=\"{{ p }}\">{{ p }}</option>\n              </sc-for>\n            </sc-raw-select>\n          </label>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#3d4542\">Distrito\n            <sc-raw-select value=\"{{ loginDist }}\" sc-camel-on-change=\"{{ onDist }}\" style=\"font-family:inherit;font-size:15px;padding:12px;border:1px solid #cfd3d1;border-radius:8px;background:#e2f4f7;min-height:48px\">\n              <option value=\"\">{{ distPlaceholder }}</option>\n              <sc-for list=\"{{ distritos }}\" as=\"d\" hint-placeholder-count=\"0\">\n                <option value=\"{{ d }}\">{{ d }}</option>\n              </sc-for>\n            </sc-raw-select>\n          </label>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#3d4542\">Categoria profissional\n            <sc-raw-select value=\"{{ loginFuncao }}\" sc-camel-on-change=\"{{ onFuncao }}\" style=\"font-family:inherit;font-size:15px;padding:12px;border:1px solid #cfd3d1;border-radius:8px;background:#e2f4f7;min-height:48px\">\n              <option value=\"\">Seleccione…</option>\n              <sc-for list=\"{{ funcoes }}\" as=\"f\" hint-placeholder-count=\"0\">\n                <option value=\"{{ f }}\">{{ f }}</option>\n              </sc-for>\n            </sc-raw-select>\n          </label>\n          <label style=\"display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#3d4542\">Nível onde trabalha\n            <sc-raw-select value=\"{{ loginNivel }}\" sc-camel-on-change=\"{{ onNivel }}\" style=\"font-family:inherit;font-size:15px;padding:12px;border:1px solid # nt&quot;,&quot;default&quot;:80,&quot;min&quot;:50,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Avaliação&quot;},&quot;requireLogin&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Acesso&quot;},&quot;showSourceNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}\">\nclass Component extends DCLogic {\n  state = { logged: false, needPerfil: false, needIntro: true, testError: \"\", isReview:false, showGallery:false, nome:\"\", history:[], showHistory:false, syncStatus:\"\", email: \"\", code: \"\", prov: \"\", dist: \"\", funcao: \"\", nivel: \"\", loginError: \"\", perfilError: \"\", mi: 0, node: 0, open: { m1: true, m2: false, m3: false }, done: {}, answers: {}, scores: {}, submitted: {}, view: \"topic\", w: typeof window !== \"undefined\" ? window.innerWidth : 1440, navOpen: false };\n\n  _onResize = () => { if (window.innerWidth !== this.state.w) this.setState({ w: window.innerWidth }); };\n\n  course() { if (this._c) return this._c; this._c = this.dataV2(); return this._c; }\n\n  dataV2() { return [{\"id\": \"m1\", \"num\": \"Módulo 1\", \"title\": \"Introdução à Investigação de Surtos\", \"topics\": [{\"n\": \"1.1\", \"t\": \"Quando considerar um surto?\", \"lead\": \"Conceito de surto e condições para a sua ocorrência.\", \"src\": \"Manual · Secção 3, pontos 1 a 3\", \"b\": [[\"p\", \"Considera-se um surto quando existe ocorrência de um número de casos de uma doença superior ao esperado, num determinado local e período. Geralmente acontece quando se identifica um número de casos fora do comum, ou um caso isolado e inesperado, que se desvia do padrão habitual.\"], [\"h\", \"O que condiciona a ocorrência dos surtos?\"], [\"p\", \"Para que ocorra surto, é necessário que haja interacções entre o hospedeiro, o agente e o ambiente em que coexistem. A existência de um hospedeiro vulnerável, num ambiente propício de uma cadeia de transmissão, que possibilite ao agente causador de doenças passar de um hospedeiro para o outro, condiciona a ocorrência de surtos.\"], [\"f\", \"imagem-1863e76a31c5.png\", \"Figura 2. A tríade da doença composta pelo hospedeiro, agente e ambiente.\"], [\"h\", \"Em que circunstâncias pode ocorrer um surto?\"], [\"p\", \"Geralmente um surto pode ocorrer por causa de uma mudança no \\\"equilíbrio\\\" natural entre hospedeiro, agente e ambiente. Por exemplo:\"], [\"l\", [\"Aumento na exposição ao agente, se as condições ambientais favorecerem a sua sobrevivência.\", \"Aumento na infectividade ou virulência do agente, por alterações no seu genótipo.\", \"Exposição do agente a novos hospedeiros — por exemplo, um portador que se desloca para uma comunidade onde a doença não existe.\", \"Aumento na transmissão do agente, com mais oportunidades de contacto (locais densamente povoados, eventos de massa, confinamento).\", \"Aumento da exposição do hospedeiro ao agente, com contacto mais frequente ou prolongado.\", \"Mudança na susceptibilidade do hospedeiro – por exemplo a imunidade que diminui com o tempo e surgimento de novas gerações nunca expostas.\"]]], \"legacyN\": \"1.1\"}, {\"n\": \"1.2\", \"t\": \"Objectivos da investigação e importância da detecção atempada\", \"lead\": \"\", \"src\": \"Manual · Secção 3, pontos 4 e 5\", \"b\": [[\"h\", \"Por que é importante a detecção atempada de um surto?\"], [\"p\", \"A detecção atempada e a investigação de surtos são essenciais porque permitem identificar e controlar rapidamente a propagação de doenças, prevenindo maiores impactos na comunidade e economizando recursos de saúde. A detecção precoce possibilita:\"], [\"l\", [\"Uma resposta imediata que pode consistir em isolamento de casos, tratamento dos afectados e mobilização de recursos para prevenir a disseminação da doença.\", \"Identificação da fonte e dos factores de transmissão, facilitando medidas específicas para interromper o surto.\", \"Fornecimento de informações sobre padrões de propagação e sobre a eficiência das intervenções de controlo e prevenção.\", \"Implementação de melhorias nos sistemas de vigilância em vigor.\"]], [\"h\", \"Como identificar se a variação do número de casos corresponde a um surto?\"], [\"p\", \"Para se declarar um surto a partir da variação dos casos de uma doença, é importante conhecer os limiares de alerta e o limiar epidémico (Figura 3), ambos utilizados para monitorar a intensidade e a progressão da doença e guiar as respostas de saúde pública.\"], [\"p\", \"O limiar de alerta refere-se ao ponto em que o número de casos começa a subir acima dos níveis esperados, sinalizando uma potencial ameaça à saúde pública.\"], [\"p\", \"O limiar epidémico é o ponto em que o número de casos confirma que um surto está em curso e requer intervenções imediatas de saúde pública.\"], [\"f\", \"imagem-e9f033f7ce13.png\", \"Figura 3. Limiares de alerta e epidémico.\"]], \"legacyN\": \"1.2\"}, {\"n\": \"1.3\", \"t\": \"Princípios orientadores da investigação de surtos\", \"lead\": \"\", \"src\": \"Manual · Secção 1, pontos 3 e 4\", \"b\": [[\"p\", \"A investigação de um surto baseia-se em princípios epidemiológicos que visam responder de forma rápida e sistemática, com o objectivo principal de descobrir a causa, a fonte e o modo de transmissão do agravo, para implementar medidas de controlo imediatas e evitar novos casos. Esses princípios podem ser:\"], [\"l\", [\"Resposta rápida e coordenada — Recomenda-se uma acção imediata e organizada, com mobilização célere de recursos humanos e materiais como prioridade.\", \"Tomada de decisão baseada em evidências — protocolos e recomendações devem fundamentar-se em evidência científica sólida e nas melhores práticas internacionais.\", \"Monitorização contínua e avaliação — Nesta etapa, a monitoria contínua dos surtos e a avaliação das intervenções aplicadas durante e após o surto é importante para garantir que as respostas sejam ajustadas em tempo real.\", \"Colaboração entre sectores — A colaboração intersectorial é essencial para abordar as causas subjacentes dos surtos e aplicar medidas de controlo abrangentes.\", \"Envolvimento comunitário e comunicação de risco — nesta etapa é importante manter as comunidades informadas e envolvidas, para se reforçar a confiança entre autoridades de saúde e a população e garantir o sucesso das intervenções.\", \"Resposta flexível e escalável — as respostas devem ser ajustáveis a surtos localizados e a epidemias de grande magnitude.\"]]], \"legacyN\": \"1.3\"}, {\"n\": \"1.4\", \"t\": \"Competências necessárias para investigar um surto\", \"lead\": \"\", \"src\": \"Manual · Secção 2, ponto 2.1 e Secção 1, ponto 6\", \"b\": [[\"p\", \"Os profissionais envolvidos na investigação de surtos devem possuir um conjunto de competências que lhes permitam identificar, caracterizar e controlar surtos de forma eficaz. Estas competências incluem:\"], [\"l\", [\"Conhecimento de sistemas de vigilância — conhecer sistemas de vigilância nacionais e internacionais e protocolos de notificação de surtos.\", \"Conhecimento técnico e científico — compreender os princípios epidemiológicos, laboratoriais e clínicos das doenças com potencial de surto.\", \"Capacidade analítica e de interpretação de dados — ter a capacidade de analisar dados epidemiológicos e laboratoriais e interpretar tendências para orientar decisões.\", \"Competência em comunicação e coordenação — ter a capacidade de se comunicar eficazmente com as autoridades de saúde, laboratórios, comunidades e parceiros internacionais.\", \"Habilidade para trabalho de campo — ter conhecimento sobre a recolha e manuseamento de amostras, aplicação de inquéritos epidemiológicos e implementação de medidas de controlo.\", \"Capacidade de gestão de crises e resposta rápida — ter a capacidade de decidir sob pressão e adaptar-se a contextos adversos com recursos limitados.\", \"Ética e confidencialidade — protecção de dados e respeito pela privacidade das populações afectadas.\"]], [\"h\", \"Quem deve investigar um surto?\"], [\"p\", \"A investigação deve ser conduzida por profissionais de saúde devidamente capacitados, incluindo epidemiologistas de campo, membros das equipas de resposta rápida, profissionais de vigilância em saúde pública e outros técnicos treinados para actuar em campo, seguindo a listagem actualizada de técnicos disponíveis e os planos de alocação definidos.\"]], \"legacyN\": \"1.5\"}, {\"n\": \"1.5\", \"t\": \"Exercício de consolidação\", \"lead\": \"Aplicar o conceito de surto e os limiares a uma situação real.\", \"src\": \"Actividade não avaliada\", \"b\": [[\"n\", \"Situação-problema\", \"Numa comunidade rural, a unidade sanitária registou nas últimas duas semanas um aumento claro de casos de diarreia aquosa, muito acima do habitual para a época. Existe uma fonte de água partilhada e saneamento deficiente.\"], [\"h\", \"Trabalhe as três perguntas\"], [\"l\", [\"Há elementos suficientes para suspeitar de um surto? Justifique com o conceito de «acima do esperado» e com a noção de limiar.\", \"Que informação adicional pediria à unidade sanitária nas próximas 24 horas?\", \"Quem deve ser notificado, e o que deve constar do alerta?\"]], [\"p\", \"Registe as respostas no caderno de exercícios; a correcção comentada é feita na sessão de tutoria. O teste avaliado do módulo encontra-se no passo seguinte.\"]], \"legacyN\": \"1.6\"}], \"test\": {\"title\": \"Teste do Módulo 1\", \"q\": [{\"p\": \"Qual das afirmações define melhor um surto?\", \"o\": [\"Qualquer caso isolado de uma doença comum\", \"A ocorrência de um número de casos superior ao esperado num determinado local e período\", \"Um aumento de casos confirmado por laboratório de referência\"], \"a\": 1}, {\"p\": \"A tríade da doença é composta por:\", \"o\": [\"Hospedeiro, agente e ambiente\", \"Médico, doente e laboratório\", \"Vacina, tratamento e isolamento\"], \"a\": 0}, {\"p\": \"O limiar de alerta distingue-se do limiar epidémico porque:\", \"o\": [\"Confirma oficialmente o surto e obriga a declará-lo\", \"É definido apenas pelo laboratório de referência\", \"Sinaliza um aumento acima do esperado e desencadeia vigilância reforçada, sem confirmar ainda o surto\"], \"a\": 2}, {\"p\": \"Quais destes princípios orientam a investigação de surtos?\", \"o\": [\"Actuar isoladamente e comunicar apenas no final\", \"Responder rapidamente, decidir com base em evidências e envolver a comunidade\", \"Adiar a investigação até todos os casos terem confirmação laboratorial\"], \"a\": 1}, {\"p\": \"Qual é uma vantagem da detecção atempada de um surto?\", \"o\": [\"Permitir uma resposta rápida, limitar a propagação e orientar as medidas de controlo\", \"Dispensar a identificação da fonte e dos factores de transmissão\", \"Eliminar a necessidade de monitorizar a evolução dos casos\"], \"a\": 0}, {\"p\": \"Qual destas opções NÃO é uma competência necessária para investigar um surto?\", \"o\": [\"Analisar dados epidemiológicos e laboratoriais\", \"Comunicar e coordenar com autoridades, laboratórios e comunidades\", \"Divulgar dados pessoais dos afectados sem respeitar a confidencialidade\"], \"a\": 2}, {\"p\": \"Qual destas opções NÃO corresponde aos requisitos de quem deve investigar um surto?\", \"o\": [\"Ter capacitação para a investigação e actuação em campo\", \"Participar sem formação adequada nem articulação com a equipa responsável\", \"Integrar as equipas e os planos de alocação definidos\"], \"a\": 1}]}}, {\"id\": \"m2\", \"num\": \"Módulo 2\", \"title\": \"Detecção, Notificação e Activação da Resposta\", \"topics\": [{\"n\": \"2.1\", \"t\": \"Vigilância como fonte de detecção de surtos\", \"lead\": \"Como o sistema de vigilância gera o sinal.\", \"src\": \"Manual · Secção 3, ponto 5\", \"b\": [[\"p\", \"A identificação de surtos a partir da análise dos dados obtidos no âmbito dos sistemas de vigilância em saúde, demonstra a sensibilidade do sistema, a capacidade de detectar casos e mudanças no padrão de ocorrência de determinada doença.\"], [\"p\", \"Os sistemas de vigilância permitem a identificação de um surto através da compreensão dos níveis basais ou padrões normais da doença numa determinada população. Estes níveis basais são estabelecidos por sistemas contínuos de vigilância, que rastreiam o número de casos notificados ao longo do tempo.\"], [\"p\", \"Como os níveis normais podem flutuar sazonal ou ciclicamente, estas variações têm de ser tidas em conta.\"], [\"h\", \"Fontes de alerta e de eventual notificação de surto\"], [\"f\", \"imagem-86683988dc32.svg\", \"Fontes de alerta e de eventual notificação de surto. Esquema baseado na proposta da equipa técnica.\"]], \"legacyN\": \"2.1\"}, {\"n\": \"2.2\", \"t\": \"Reconhecimento e suspeita de um possível surto\", \"lead\": \"Ler os sinais de alerta na unidade sanitária.\", \"src\": \"Manual · Secção 3, pontos 1 e 5\", \"b\": [[\"p\", \"A suspeita de um surto é geralmente levantada quando profissionais de saúde identificam um número de casos fora do comum, ou um caso isolado e inesperado que se desvia do padrão habitual. Avaliar se o aumento real dos casos, constitui de facto um surto e exige análise criteriosa e comparação com os limiares predefinidos.\"], [\"l\", [\"Aumento inesperado de casos de uma síndrome face às semanas anteriores e à média histórica.\", \"Agrupamento de casos com ligação no tempo, no espaço ou numa exposição comum.\", \"Caso suspeito de doença cujo limiar, na Secção 4 do manual, é de um único caso.\", \"Óbito inexplicado em pessoa previamente saudável.\", \"Rumor comunitário consistente, ainda sem caso notificado.\"]], [\"n\", \"Cuidado\", \"Alterações nos critérios de diagnóstico, na testagem ou no registo podem simular um aumento de casos. O manual chama a este fenómeno pseudoepidemia — um aumento de resultados positivos ou da incidência sem aumento real da doença.\"]], \"legacyN\": \"2.2\"}, {\"n\": \"2.3\", \"t\": \"Critérios para iniciar uma investigação\", \"lead\": \"Quando o sinal se transforma em investigação.\", \"src\": \"Manual · Secção 3, ponto 5 e Secção 4\", \"b\": [[\"p\", \"Antes do início de uma investigação de surto, é importante comparar os limiares de alerta com o epidémico. Se os dados atingirem o limiar de alerta, intensifica-se a monitorização e iniciam-se investigações preliminares. Se a monitoria revelar um limiar epidémico, o surto é declarado e as intervenções devem ser imediatas.\"], [\"p\", \"Se a vigilância sindrómica facilitar a identificação rápida de potenciais surtos, fornecendo uma estrutura eficiente para monitorizar os principais conjuntos de sintomas que podem indicar a presença de doenças infecciosas, pode-se iniciar também uma investigação de surto.\"], [\"p\", \"Para além destes factos, deve se ter em conta:\"], [\"l\", [\"Excesso de casos face ao limiar de alerta ou ao limiar epidémico definido para a área e época.\", \"Um único caso suspeito ou confirmado, quando o limiar da síndrome fixado na Secção 4 é de um caso.\", \"Evento com potencial de propagação internacional, no quadro do Regulamento Sanitário Internacional (2005), ao qual o manual adere integralmente.\"]]], \"legacyN\": \"2.3\"}, {\"n\": \"2.4\", \"t\": \"Notificação do surto\", \"lead\": \"O que notificar e a quem.\", \"src\": \"Manual · Secção 2\", \"b\": [[\"p\", \"Em muitos casos, o primeiro relato de um surto é recebido por um profissional de saúde a nível local — técnico de saúde, técnico de vigilância, enfermeiro ou médico na unidade sanitária. Estes profissionais têm um papel crucial na detecção inicial e na notificação dos surtos aos níveis superiores de vigilância.\"], [\"p\", \"Em resumo, a notificação de um surto é a comunicação obrigatória e urgente feita para as autoridades de saúde, sobre o aumento inesperado de casos de uma doença numa área restrita ou comunidade.\"], [\"n\", \"Retenha\", \"A notificação não espera pela confirmação laboratorial: é a suspeita fundamentada, comparada com o limiar da síndrome, que desencadeia o alerta e a investigação.\"]], \"legacyN\": \"2.4\"}, {\"n\": \"2.5\", \"t\": \"Fluxo de notificação\", \"lead\": \"O caminho do alerta e da resposta.\", \"src\": \"Manual · Secção 2, Figura 1\", \"b\": [[\"p\", \"O manual descreve o fluxo de notificação e resposta a surtos na Figura 1, articulando os níveis do sistema de saúde — da detecção na comunidade e na unidade sanitária à activação da investigação e à retroinformação.\"], [\"f\", \"imagem-3ad8882153e6.png\", \"Figura 1. Fluxo de notificação e resposta aos surtos.\"], [\"l\", [\"Nível distrital — registo e avaliação da notificação; início da investigação através da epidemiologia descritiva.\", \"Nível provincial — avaliação do alerta e notificação ao nível nacional; início da investigação através da epidemiologia descritiva ou analítica.\", \"Nível central — avaliação da gravidade do evento, do risco de casos e da sua disseminação; se o evento for considerado grave, mobiliza-se uma Equipa de Resposta Rápida (ERR) para o local.\"]]], \"legacyN\": \"2.5\"}, {\"n\": \"2.6\", \"t\": \"Activação da resposta\", \"lead\": \"Do alerta à equipa em movimento.\", \"src\": \"Manual · Secção 5, ponto 1.3\", \"b\": [[\"p\", \"Após a selecção da equipa de campo e a definição de papéis e responsabilidades, o manual prevê três etapas de alinhamento:\"], [\"l\", [\"Reunião de preparação — reunir os membros propostos da equipa e o pessoal da base para rever os detalhes do problema de saúde pública, a natureza do pedido de assistência, o conhecimento actual sobre o patógeno ou doença suspeita, os objectivos e as responsabilidades preliminarmente acordadas.\", \"Reunião inicial com o solicitante — com o responsável pelo pedido (por exemplo, o supervisor de vigilância local), para garantir que os responsáveis locais estão informados e preparados para a chegada da equipa.\", \"Formulário de saída para o campo — redigido por um membro sénior antes da partida, resumindo como e quando o pedido foi feito, a informação local fornecida, os objectivos acordados, os membros da equipa e a data prevista de chegada.\"]], [\"p\", \"Este formulário é importante para evitar redundâncias, documentar a investigação e garantir que todos os envolvidos compreendem o objectivo e as expectativas.\"]], \"legacyN\": \"2.6\"}, {\"n\": \"2.7\", \"t\": \"Preparação da equipa de investigação\", \"lead\": \"Composição, funções e responsabilidades.\", \"src\": \"Manual · Secção 5, pontos 1.1 e 1.2\", \"b\": [[\"p\", \"A equipa de campo é composta principalmente por epidemiologistas, definidos conforme as características do evento e o perfil dos profissionais disponíveis. Em surtos complexos é necessário envolver outros profissionais, instituições e serviços: investigadores, técnicos de laboratório, infectologistas, entomologistas, antropólogos, estatísticos e especialistas em comunicação de risco, entre outros.\"], [\"p\", \"Muitas investigações exigem suporte laboratorial. Mesmo com laboratórios locais disponíveis, a equipa deve contactar imediatamente os laboratórios de referência para partilhar detalhes do problema e discutir tipos de amostras, métodos de colheita e processamento.\"], [\"h\", \"Questões a esclarecer antes de partir\"], [\"l\", [\"Quem será o líder da equipa, responsável pela orientação geral e pela conclusão da investigação?\", \"Que recursos estão disponíveis, incluindo transporte e alojamento no campo?\", \"Quem será o porta-voz para a imprensa e os representantes locais?\", \"Quem é responsável pela análise de dados e como serão os dados partilhados?\", \"Como será a informação comunicada e coordenada entre as partes envolvidas?\", \"Quem redigirá o relatório final e a quem será enviado?\"]], [\"n\", \"Objectivos primeiro\", \"Antes das funções, esclareça as questões centrais de saúde pública a responder, os objectivos específicos da investigação e as medidas de controlo e prevenção que se pretende desenvolver.\"]], \"legacyN\": \"2.7\"}, {\"n\": \"2.8\", \"t\": \"Preparação logística e dos recursos necessários\", \"lead\": \"Requisitos administrativos, logísticos e técnicos.\", \"src\": \"Manual · Secção 5, pontos 1.4 e 2.1; Anexo 2\", \"b\": [[\"l\", [\"Aspectos administrativos — contactos estabelecidos e coordenação eficaz com a equipa local.\", \"Aspectos logísticos — recursos mínimos assegurados, equipa organizada, tarefas distribuídas e supervisão da execução do trabalho de campo.\", \"Aspectos técnicos — dados de notificação e demográficos, mapas básicos, modelos de questionários, manuais de procedimentos, informação clínica e laboratorial, apoio estatístico e insumos para colheita, armazenamento e transporte de amostras.\"]], [\"h\", \"Documentação e materiais essenciais (Anexo 2)\"], [\"l\", [\"Documentos administrativos e autorizações relevantes; relatórios preliminares sobre o surto.\", \"Questionário de investigação, formulários de notificação e caderno para registo de dados.\", \"Equipamento de protecção individual (EPI) e etiquetas para identificação de amostras.\", \"Computador portátil para entrada e análise de dados, com Excel ou Epi Info, e dispositivo GPS.\", \"Contactos locais de referência e materiais de papelaria.\"]], [\"n\", \"Segurança no campo\", \"Os membros da equipa devem ter a vacinação em dia e, se necessário, tomar medicamentos profiláticos. Recomenda-se levar um kit de primeiros socorros — antibióticos, antieméticos, analgésicos, repelentes, protector solar — e EPI como luvas, máscaras e batas. É igualmente fundamental garantir a confidencialidade de toda a informação recolhida.\"], [\"annex\", \"Consultar a lista de materiais — Anexo 2 (páginas 154–155)\"]], \"legacyN\": \"2.8\"}, {\"n\": \"2.9\", \"t\": \"Exercício de consolidação\", \"lead\": \"Simular um alerta, o seu fluxo e a saída para o campo.\", \"src\": \"Actividade não avaliada\", \"b\": [[\"n\", \"Situação-problema\", \"Sexta-feira, 17h00: um agente comunitário informa a unidade sanitária de três óbitos por diarreia aguda no mesmo bairro, nas últimas 48 horas. Não há casos notificados no sistema.\"], [\"l\", [\"Que sinais justificam tratar este rumor como possível surto?\", \"Redija o alerta com a informação mínima exigida.\", \"Identifique os níveis a envolver no fluxo de notificação e a retroinformação esperada.\", \"Preencha o formulário de saída para o campo e a lista de material essencial do Anexo 2.\"]]], \"legacyN\": \"2.9\"}], \"test\": {\"title\": \"Teste do Módulo 2\", \"q\": [{\"p\": \"A capacidade do sistema de vigilância de detectar casos e mudanças no padrão de ocorrência de uma doença designa-se:\", \"o\": [\"Especificidade do laboratório\", \"Cobertura vacinal\", \"Sensibilidade do sistema\"], \"a\": 2}, {\"p\": \"Onde encontra, para cada síndrome, o número de casos necessários para desencadear a notificação e a investigação?\", \"o\": [\"Na Secção 4 do manual, por categoria sindrómica\", \"Nas referências bibliográficas do manual\", \"No relatório anual de vigilância\"], \"a\": 0}, {\"p\": \"Segundo a Secção 2 do manual, o que é fundamental para uma resposta eficiente e eficaz?\", \"o\": [\"A existência de um único epidemiologista por província\", \"Competências essenciais dos profissionais e um fluxo claro de notificação e comunicação\", \"A publicação científica dos resultados\"], \"a\": 1}, {\"p\": \"Antes da partida para o campo, o manual prevê que um membro sénior redija:\", \"o\": [\"O relatório final da investigação\", \"O comunicado de imprensa\", \"O formulário de saída para o campo, resumindo pedido, objectivos, equipa e data de chegada\"], \"a\": 2}, {\"p\": \"A preparação do trabalho de campo deve atender a três tipos de requisitos:\", \"o\": [\"Administrativos, logísticos e técnicos\", \"Clínicos, jurídicos e financeiros\", \"Políticos, sociais e ambientais\"], \"a\": 0}]}}, {\"id\": \"m3\", \"num\": \"Módulo 3\", \"title\": \"Conduzindo uma Investigação de Surto\", \"topics\": [{\"n\": \"3.1\", \"t\": \"Preparar a investigação\", \"lead\": \"Planificar os aspectos operacionais do trabalho de campo.\", \"src\": \"Manual · Secção 5, ponto 2.1\", \"b\": [[\"p\", \"A equipa de campo deve planificar os aspectos operacionais do trabalho de campo, prestando especial atenção a três tipos de requisitos fundamentais: administrativos, logísticos e técnicos. É igualmente fundamental garantir a confidencialidade de toda a informação a ser recolhida.\"], [\"l\", [\"Administrativos — contactos e coordenação eficaz com a equipa local.\", \"Logísticos — recursos mínimos, organização da equipa, distribuição de tarefas e supervisão da execução.\", \"Técnicos — dados de notificação e demográficos, mapas, questionários, normas, informação clínica e laboratorial, apoio estatístico e insumos para amostras.\"]], [\"n\", \"Equipamentos essenciais\", \"Computadores portáteis com programas instalados (por exemplo Excel, Epi Info), telemóveis com contactos-chave, câmaras fotográficas para documentação de campo e aparelhos de GPS para mapeamento.\"], [\"n\", \"Como ler estes passos\", \"O manual apresenta as etapas numa ordem geralmente cronológica, mas diferentes situações podem exigir desvios desta sequência: na prática, algumas etapas são realizadas simultaneamente, outras estão em curso ao longo da investigação e algumas podem não ser necessárias, dependendo das circunstâncias.\"]], \"legacyN\": \"3.1\"}, {\"n\": \"3.2\", \"t\": \"Confirmar a existência do surto e o diagnóstico\", \"lead\": \"Verificar o diagnóstico e comparar com o esperado.\", \"src\": \"Manual · Secção 5, ponto 2.2\", \"b\": [[\"p\", \"Este passo envolve duas etapas sequenciais:\"], [\"l\", [\"Verificação do diagnóstico dos casos reportados que levantaram a suspeita de um surto.\", \"Após a confirmação dos casos, é importante comparar as taxas de incidência para determinar se a ocorrência observada da doença está acima do esperado.\"]], [\"p\", \"Numa doença transmissível, uma concentração de falsos casos devido a erros de diagnóstico ou laboratoriais, pode levar a uma pseudoepidemia — um aumento nos resultados positivos ou na incidência sem aumento real da doença. É por isso importante, rever os históricos clínicos e laboratoriais dos casos notificados, podendo ser necessário realizar entrevistas e consultar especialistas.\"], [\"h\", \"Verificação clínica e laboratorial\"], [\"p\", \"A revisão dos históricos clínicos e laboratoriais permite traçar o perfil da frequência dos sintomas e sinais da doença, identificar os requisitos laboratoriais para confirmação de futuros casos e, quando necessário, descartar casos inicialmente reportados.\"], [\"p\", \"Para cada síndrome prioritária, a Secção 4 do manual indica o agente etiológico, o reservatório, os modos de transmissão, os períodos de incubação e de infecciosidade, os grupos de risco e, em detalhe, o tipo de amostras, os procedimentos de colheita, o armazenamento e transporte, a biossegurança e o laboratório de referência.\"], [\"n\", \"Colaboração antecipada\", \"Contacte os laboratórios de referência logo no início — mesmo com laboratório local disponível — para discutir tipos de amostras, métodos de colheita e processamento.\"]], \"legacyN\": \"3.2\"}, {\"n\": \"3.3\", \"t\": \"Estabelecer a definição de caso\", \"lead\": \"Classificar os casos de forma uniforme.\", \"src\": \"Manual · Secção 5, ponto 2.3\", \"b\": [[\"p\", \"Para uma investigação eficaz é essencial definir criteriosamente os casos, classificando-os de acordo com os sinais e sintomas, os testes laboratoriais e o contexto epidemiológico. A definição divide-se em categorias, permitindo uma contagem precisa e uniforme dos casos relacionados com o surto.\"], [\"l\", [\"Caso suspeito — indivíduo que apresenta alguns sinais e sintomas sugestivos de um grupo de doenças que partilham a mesma sintomatologia.\", \"Caso provável — com características clínicas típicas, sem diagnóstico laboratorial.\", \"Caso confirmado — caso suspeito ou provável confirmado por diagnóstico laboratorial.\", \"Caso confirmado por critério clínico-epidemiológico – este deve apresentar clínica compatível com a doença e ter sido causado pela mesma fonte que o caso confirmado por critério laboratorial.\"]], [\"n\", \"Exemplo do manual\", \"Num surto de gripe: caso suspeito — febre ou sintomas respiratórios, sem teste realizado e sem contacto conhecido com caso confirmado; caso confirmado — febre ≥ 38 °C e sintomas respiratórios, com teste positivo para influenza e ligação epidemiológica à área de surto.\"]], \"legacyN\": \"3.4\"}, {\"n\": \"3.4\", \"t\": \"Identificar casos (busca activa)\", \"lead\": \"Encontrar os casos que o sistema não captou.\", \"src\": \"Manual · Secção 5, ponto 2.4\", \"b\": [[\"p\", \"A busca activa de casos assegura que todos os casos relacionados com o surto sejam identificados, especialmente os que não procuraram serviços de saúde ou foram subnotificados. É geralmente realizada após a definição de caso, durante as etapas de identificação e contagem. Ela permite:\"], [\"l\", [\"Identificar casos adicionais que não foram capturados pelos sistemas de vigilância passiva.\", \"Ampliar a compreensão da extensão do surto, incluindo grupos populacionais ou áreas geográficas mais afectadas.\", \"Fornecer dados mais completos para a análise epidemiológica, aumentando a precisão da resposta.\"]], [\"p\", \"Envolve visitas a locais com prováveis casos — hospitais, centros de saúde e comunidades — e pode incluir entrevistas com provedores de saúde e pacientes, e inquéritos domiciliares. É importante envolver líderes comunitários e agentes de saúde locais para facilitar a identificação e o acompanhamento dos casos.\"]], \"legacyN\": \"3.5\"}, {\"n\": \"3.5\", \"t\": \"Descrever os casos por pessoa, lugar e tempo\", \"lead\": \"Epidemiologia descritiva e tipos de curva.\", \"src\": \"Manual · Secção 5, ponto 2.5 e Secção 3, ponto 6\", \"b\": [[\"p\", \"A epidemiologia descritiva caracteriza o surto segundo três critérios: tempo, lugar e pessoa. Permite compreender a extensão do surto, identificar padrões e inferir possíveis fontes de propagação, dando base para direccionar as acções de controlo.\"], [\"l\", [\"Tempo — descreve a evolução do surto ao longo do tempo, envolvendo a criação de uma curva epidemiológica.\", \"Lugar — distribuição por regiões, cidades ou bairros, identificando áreas de maior risco e factores locais.\", \"Pessoa — idade, sexo, ocupação e outros factores de risco, para identificar quem está mais vulnerável.\"]], [\"f\", \"imagem-dd0b25f5d998.png\", \"Figura 7. Distribuição dos casos e óbitos do surto, localidade de Chitima, Tete, Janeiro 2015 (Fonte: INS).\"], [\"h\", \"O que a forma da curva indica\"], [\"l\", [\"Fonte comum pontual — exposição num período muito curto; pico acentuado seguido de declínio gradual.\", \"Fonte comum contínua — exposição prolongada; casos sustentados ou flutuantes, em forma de planalto.\", \"Propagado — transmissão de pessoa para pessoa; ondas sucessivas, com vários picos correspondentes a novas gerações de casos.\"]], [\"f\", \"imagem-53af9c44e60a.jpg\", \"Figura 4. Surto de fonte comum pontual.\"], [\"f\", \"imagem-f33ff3b281fe.jpg\", \"Figura 5. Curva epidemiológica apresentada no manual.\"], [\"f\", \"imagem-46df10c609b6.png\", \"Figura 6. Surtos propagados.\"], [\"f\", \"imagem-2eac3d64570a.jpg\", \"Casos de malária notificados semanalmente em comparação com a média histórica específica da unidade sanitária, Província de Sofala, 2019 (Fonte: Boletim Mensal n.º 20, Resposta ao Ciclone Idai).\"]], \"legacyN\": \"3.6\"}, {\"n\": \"3.6\", \"t\": \"Ética, confidencialidade e comunicação dos resultados\", \"lead\": \"Princípios éticos e devolutiva à comunidade.\", \"src\": \"Manual · Secção 5 (ética e comunicação)\", \"b\": [[\"p\", \"O manual estabelece que os investigadores, ou a instituição responsável pela investigação, devem garantir que a comunidade seja informada sobre os resultados da investigação e sobre as recomendações a implementar a esse nível.\"], [\"h\", \"Princípios éticos na comunicação e no uso dos dados\"], [\"l\", [\"Os dados devem ser usados apenas para os fins previstos, armazenados de forma segura e acessíveis apenas a profissionais autorizados; a confidencialidade deve ser assegurada em todas as etapas, da recolha à divulgação.\", \"Consentimento informado — ou assentimento, para menores de 18 anos — com informação prévia sobre objectivos, procedimentos, benefícios e riscos; em emergência, o consentimento verbal é válido se documentado.\", \"Comunicação em linguagem clara e acessível, respeitando os contextos culturais e linguísticos das comunidades.\", \"Equidade e não discriminação: evitar estigmatização e assegurar distribuição justa dos benefícios da investigação.\", \"Envolvimento activo das comunidades e monitorização por comités de ética.\"]], [\"p\", \"O manual acrescenta que as investigações devem ser monitorizadas por comités de ética, para garantir a conformidade com os padrões éticos, minimizando potenciais danos e maximizando os benefícios para a saúde pública.\"]], \"legacyN\": \"3.7\"}, {\"n\": \"3.7\", \"t\": \"Exercício integrador: investigação de um surto\", \"lead\": \"Percorrer os passos num caso completo.\", \"src\": \"Actividade não avaliada\", \"b\": [[\"n\", \"Caso\", \"Distrito costeiro, estação chuvosa. Em nove dias são registados 74 casos de diarreia aquosa aguda e 3 óbitos, concentrados em dois bairros com uma fonte de água partilhada.\"], [\"h\", \"Produtos esperados\"], [\"l\", [\"Definições de caso suspeito, provável e confirmado, aplicáveis em campo.\", \"Linha de casos preenchida e curva epidemiológica desenhada, com identificação do tipo de surto.\", \"Duas hipóteses e o desenho de estudo escolhido para as testar.\", \"Três medidas de controlo imediatas, com responsável e prazo.\", \"Plano de devolutiva à comunidade, respeitando os princípios éticos do manual.\"]]], \"legacyN\": \"3.8\"}], \"test\": {\"title\": \"Teste do Módulo 3\
